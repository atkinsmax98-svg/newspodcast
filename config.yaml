# Daily News Podcast configuration

podcast:
  title: "Your Daily Briefing"
  description: "A daily NPR-style news script covering trail & ultra running, legal news, Boise weather and local news, and new indie/twangy music."

# Each topic becomes one segment of the show, in this order.
# `query` is a Google News search query. `when` restricts results to the
# last N hours (Google News RSS supports when:Xh / when:Xd).
topics:
  - name: "Trail Running"
    query: "trail running"
    when: "1d"
    max_articles: 5

  - name: "Marathon Running"
    query: "marathon running"
    when: "1d"
    max_articles: 5

  - name: "Ultramarathon Running"
    query: "ultramarathon OR ultrarunning"
    when: "1d"
    max_articles: 5

  - name: "Running Physiology & Science"
    query: "running physiology OR sports science running study"
    when: "2d"
    max_articles: 4

  - name: "Legal News"
    query: "law OR legal OR Supreme Court OR litigation"
    when: "1d"
    max_articles: 6

  - name: "Boise, Idaho Local News"
    query: "Boise Idaho"
    when: "1d"
    max_articles: 6

  - name: "New Indie & Twangy Music"
    query: "new album release indie folk OR alt-country OR Americana"
    when: "3d"
    max_articles: 5

weather:
  enabled: true
  location_name: "Boise, Idaho"
  # NOAA/NWS grid point for Boise, ID (no API key required).
  latitude: 43.6150
  longitude: -116.2023

# Gemini is used to turn the raw headlines into an NPR-style script.
writer:
  model: "gemini-3.6-flash"
  target_minutes: 18
  words_per_minute: 150
