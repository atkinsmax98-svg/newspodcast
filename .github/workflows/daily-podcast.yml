name: Generate Daily Script

on:
  schedule:
    # 12:00 UTC = ~5-6am America/Boise (Mountain Time), depending on DST.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate today's script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m src.main

      - name: Compute today's date
        id: today
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "date_display=$(date +'%A, %B %d, %Y')" >> "$GITHUB_OUTPUT"

      - name: Email today's script
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Your Daily Briefing -- ${{ steps.today.outputs.date_display }}"
          to: atkinsmax98@gmail.com
          from: "Daily Briefing Bot <${{ secrets.EMAIL_USERNAME }}>"
          body: file://docs/episodes/${{ steps.today.outputs.date }}.txt

      - name: Commit and push new script
        run: |
          git config user.name "daily-podcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add script for $(date +'%Y-%m-%d')"
            git push
          fi
