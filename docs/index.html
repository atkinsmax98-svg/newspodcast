<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Your Daily Briefing</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  .subscribe { background: #f4f4f4; border-radius: 8px; padding: 12px 16px; margin: 20px 0; word-break: break-all; }
  .episode { border-bottom: 1px solid #eee; padding: 16px 0; }
  .episode h3 { margin: 0 0 4px 0; }
  .episode audio { width: 100%; margin-top: 8px; }
  .date { color: #888; font-size: 0.9em; }
</style>
</head>
<body>
  <h1>Your Daily Briefing</h1>
  <p class="sub">Trail &amp; ultra running, marathons, running science, legal news, Boise weather &amp; local news, and new indie/twangy music -- every day.</p>

  <div class="subscribe">
    <strong>Subscribe in any podcast app:</strong><br />
    <code id="feed-url">feed.xml</code>
  </div>

  <div id="episodes">Loading episodes...</div>

  <script>
    const feedUrl = new URL("feed.xml", location.href).toString();
    document.getElementById("feed-url").textContent = feedUrl;

    fetch("episodes/manifest.json")
      .then((r) => (r.ok ? r.json() : []))
      .then((episodes) => {
        const container = document.getElementById("episodes");
        if (!episodes.length) {
          container.textContent = "No episodes published yet -- check back after the next scheduled run.";
          return;
        }
        container.innerHTML = episodes
          .map(
            (ep) => `
          <div class="episode">
            <h3>${ep.title}</h3>
            <div class="date">${ep.pub_date}</div>
            <p>${ep.description}</p>
            <audio controls src="episodes/${ep.filename}"></audio>
          </div>`
          )
          .join("");
      })
      .catch(() => {
        document.getElementById("episodes").textContent = "Could not load episode list.";
      });
  </script>
</body>
</html>
